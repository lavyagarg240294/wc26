<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FIFA World Cup 2026 — Companion</title>
<meta name="description" content="Your FIFA World Cup 2026 companion — live scores, group tables, full 48-team squads, and a bracket that fills itself. All 104 matches.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FIFA World Cup 2026 Companion">
<meta property="og:url" content="https://lavyagarg240294.github.io/wc26/">
<meta property="og:title" content="FIFA World Cup 2026 — your companion">
<meta property="og:description" content="Live scores, group tables, full 48-team squads, and a bracket that fills itself — every match in your timezone.">
<meta property="og:image" content="https://lavyagarg240294.github.io/wc26/assets/og.png?v=18">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="FIFA World Cup 2026 companion">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="FIFA World Cup 2026 — your companion">
<meta name="twitter:description" content="Live scores, group tables, full 48-team squads, and a bracket that fills itself.">
<meta name="twitter:image" content="https://lavyagarg240294.github.io/wc26/assets/og.png?v=18">
<meta name="theme-color" content="#0BA360">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=42">
<link rel="icon" href="assets/wc26-emblem.svg">
</head>
<body>

<div id="bg" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
<div id="themeSweep" aria-hidden="true"></div>

<header class="topbar">
  <a class="wordmark" href="#matches" data-nav="matches" aria-label="FIFA World Cup 2026">
    <img class="wm-logo" src="assets/wc26-emblem.svg" width="22" height="34" alt="" decoding="async">
    <span class="wm-text">
      <span class="wm-full"><span class="wm-fifa">FIFA</span> World Cup <b>2026</b></span>
      <span class="wm-short">World Cup <b>26</b></span>
    </span>
  </a>
  <div class="topbar-right">
    <button class="chip chip-icon" id="musicChip" title="Background music" aria-pressed="false" aria-label="Toggle background music">
      <svg class="ic-music" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <button class="chip" id="tzChip" title="Change timezone">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span id="tzLabel">Auto</span>
    </button>
    <button class="chip chip-team" id="teamChip" title="Pick your team">
      <span id="teamChipFlag">⚽</span><span id="teamChipName">Pick a team</span>
    </button>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Sections">
  <button class="tab is-active" data-nav="matches">Matches</button>
  <button class="tab" data-nav="teams">Teams</button>
  <button class="tab" data-nav="groups">Groups</button>
  <button class="tab" data-nav="bracket">Bracket</button>
  <button class="tab" data-nav="stats">Stats</button>
  <button class="tab" data-nav="sim">Predict</button>
  <span class="tab-ink" id="tabInk" aria-hidden="true"></span>
</nav>

<div class="ticker" id="ticker" hidden aria-hidden="true"><div class="ticker-track" id="tickerTrack"></div></div>

<main id="main">
  <section class="view" id="view-matches"></section>
  <section class="view" id="view-teams" hidden></section>
  <section class="view" id="view-groups" hidden></section>
  <section class="view" id="view-bracket" hidden></section>
  <section class="view" id="view-stats" hidden></section>
  <section class="view" id="view-sim" hidden></section>
</main>

<footer class="foot">
  <span id="updatedLabel">Schedule loaded</span>
  <button class="foot-refresh" id="refreshBtn" data-refresh title="Refresh scores now" aria-label="Refresh scores">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
  <span class="foot-dot">·</span>
  <span>Unofficial fan project — times shown in <b id="footTz"></b></span>
  <span class="foot-dot">·</span>
  <span class="foot-build" id="buildTag"></span>
</footer>

<!-- Timezone picker -->
<dialog id="tzDialog" class="sheet">
  <div class="sheet-head"><h3>Match times in…</h3><button class="sheet-x" data-close>✕</button></div>
  <div class="sheet-body" id="tzList"></div>
</dialog>

<!-- Match detail -->
<dialog id="matchDialog" class="sheet">
  <div class="sheet-head"><h3 id="matchTitle">Match</h3><button class="sheet-x" data-close>✕</button></div>
  <div class="sheet-body" id="matchBody"></div>
</dialog>

<!-- Squad viewer (any team) -->
<dialog id="squadDialog" class="sheet">
  <div class="sheet-head"><h3 id="squadTitle">Squad</h3><button class="sheet-x" data-close>✕</button></div>
  <div class="sheet-body" id="squadBody"></div>
</dialog>

<!-- Team picker -->
<dialog id="teamDialog" class="sheet">
  <div class="sheet-head"><h3>Your team</h3><button class="sheet-x" data-close>✕</button></div>
  <input class="team-search" id="teamSearch" type="search" placeholder="Search 48 teams…" autocomplete="off">
  <div class="sheet-body team-grid" id="teamList"></div>
  <button class="team-clear" id="teamClear">Follow no team</button>
</dialog>

<button id="jumpNow" class="jump-now" hidden aria-label="Jump to today">
  <span class="jn-dot" aria-hidden="true"></span><span id="jnLabel">Today</span>
</button>

<canvas id="confetti" aria-hidden="true"></canvas>
<audio id="bgm" loop preload="none" src="assets/anthem.mp3"></audio>

<script src="app.js?v=42"></script>
</body>
</html>
