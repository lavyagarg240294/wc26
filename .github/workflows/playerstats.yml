name: Update player stats

# Per-player tournament stat summary for the semi-finalists (distance, top speed, sprints, shots, xG, passes), baked
# into data/playerstats.json by scripts/fetch-playerstats.mjs from FIFA's public data hub (fdh-api.fifa.com). Post-match
# data, so an infrequent cron is plenty; new matches (the semis, then the final) join automatically as FIFA publishes them.
on:
  schedule:
    - cron: "47 */3 * * *"     # every ~3h, offset from the other feeds
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playerstats
  cancel-in-progress: true

jobs:
  playerstats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Fetch player stats, commit if changed
        run: |
          git config user.name "wc26-bot"
          git config user.email "actions@users.noreply.github.com"
          node scripts/fetch-playerstats.mjs || echo "playerstats fetch error — skipping this run"
          git add data/playerstats.json 2>/dev/null
          if ! git diff --cached --quiet 2>/dev/null; then
            git commit -m "playerstats: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push 2>/dev/null \
              || { git fetch origin main && git rebase -X theirs origin/main 2>/dev/null && git push 2>/dev/null; } \
              || { git rebase --abort 2>/dev/null; git reset --hard origin/main; echo "push deferred — resynced, will retry next run"; }
          else
            echo "no player-stats changes"
          fi
