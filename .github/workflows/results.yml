name: Update scores

# Live scores want ~5-minutely refreshes, but GitHub throttles `schedule` crons to
# roughly once every few hours — far too slow for live matches. So instead of relying
# on the cron for each refresh, ONE run polls in a loop (every 5 min near kickoffs,
# every 30 min in quiet hours) for ~5 hours, then relaunches itself. The cron below is
# only a safety-net restarter in case the self-relaunch chain ever breaks.
on:
  schedule:
    - cron: "*/15 * * * *"     # safety-net restarter only — GitHub throttles this heavily, which is fine
  workflow_dispatch:            # manual "Run workflow" + the self-relaunch target

permissions:
  contents: write
  actions: write                # lets the run relaunch itself (workflow_dispatch is exempt from the GITHUB_TOKEN no-recursion rule)

concurrency:
  group: results
  cancel-in-progress: true      # exactly one polling loop alive; any fresh trigger replaces the running one

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350         # just under the 6h job cap; the loop budgets ~5h then relaunches
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # full history so the in-loop push can rebase cleanly over share-card commits
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Poll scores in a loop, then relaunch
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "wc26-bot"
          git config user.email "actions@users.noreply.github.com"
          deadline=$(( $(date +%s) + 18000 ))     # ~5h of polling, then relaunch (keeps under the job timeout)
          while [ "$(date +%s)" -lt "$deadline" ]; do
            node scripts/fetch-results.mjs || echo "fetch error — will retry next loop"
            if ! git diff --quiet data/results.json data/photos.json 2>/dev/null; then
              git add data/results.json data/photos.json
              git commit -m "scores: $(date -u +'%Y-%m-%d %H:%M UTC')"
              git push 2>/dev/null || { git pull --rebase origin main && git push; } || echo "push deferred to next loop"
            else
              echo "no changes @ $(date -u +%H:%M) UTC"
            fi
            # adaptive cadence: poll every 5 min when a match is within [-1h, +3.5h] of kickoff, else every 30 min
            near=$(node -e "const m=require('./data/matches.json').matches;const n=Date.now();process.stdout.write(m.some(x=>{const t=+new Date(x.utc);return n>t-3.6e6 && n<t+1.26e7})?'1':'0')")
            [ "$near" = "1" ] && sleep 300 || sleep 1800
          done
          echo "polling budget reached — relaunching the workflow"
          gh workflow run results.yml || echo "self-dispatch failed; the */15 cron will restart it"
