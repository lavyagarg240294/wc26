name: Update scores

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 min for live scores (June 11 – July 19; disable after). NB: GitHub cron can lag.
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: results
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Fetch latest scores
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/fetch-results.mjs
      - name: Commit if changed
        run: |
          if ! git diff --quiet data/results.json 2>/dev/null; then
            git config user.name "wc26-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/results.json
            git commit -m "scores: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes."
          fi
